<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>numpy explore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.0/full/pyodide.js"></script>
<style>
  :root {
    --bg:#ffffff; --surface:#f7f7f5; --surface2:#efefec; --border:#e0e0dc;
    --text:#1a1a18; --muted:#6b6b66; --accent:#185fa5; --danger:#a32d2d; --ok:#0f6e56;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:#ffffff; color:var(--text); font:14px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:500; margin:0; }
  header .tag { font-size:12px; color:var(--muted); }
  header .nplogo { display:flex; align-items:center; }
  header .glink { font-size:12.5px; color:var(--accent); text-decoration:none; padding:4px 8px; }
  header .glink:hover { text-decoration:underline; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .status { font-size:12px; color:var(--muted); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-right:5px; }
  .dot.ok{background:var(--ok);} .dot.err{background:var(--danger);} .dot.busy{background:#ef9f27;}
  button { font:inherit; font-size:12.5px; padding:4px 10px; cursor:pointer; background:transparent;
           color:var(--text); border:1px solid var(--border); border-radius:6px; }
  button:hover { background:var(--surface2); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 47px); }
  @media (max-width:860px){ main{grid-template-columns:1fr; height:auto;} }
  .col { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .col + .col { border-left:1px solid var(--border); }
  @media (max-width:860px){ .col + .col { border-left:none; border-top:1px solid var(--border);} }
  .tabs { display:flex; align-items:stretch; gap:0; background:var(--surface); border-bottom:1px solid var(--border);
          overflow-x:auto; flex:0 0 auto; }
  .tab { padding:7px 13px; font-size:12.5px; color:var(--muted); cursor:pointer; white-space:nowrap;
         border:none; border-right:1px solid var(--border); border-radius:0; background:transparent; }
  .tab:hover { background:var(--surface2); }
  .tab[aria-selected="true"] { background:var(--bg); color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); }
  .body { flex:1 1 auto; min-height:0; overflow:auto; }
  .CodeMirror { height:100%; font-family:var(--mono); font-size:13.5px; background:transparent; }
  @media (max-width:860px){ .CodeMirror{ height:300px; } .body{ max-height:420px; } }
  #mathPane { padding:18px 16px; }
  .bigmath { display:flex; align-items:center; justify-content:center; min-height:90px; overflow-x:auto; font-size:17px; }
  .section { font-size:11.5px; text-transform:none; color:var(--muted); margin:14px 0 6px; }
  .cond { display:block; margin:4px 0; }
  pre.ir { margin:0; padding:14px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.7;
           white-space:pre; color:var(--text); }
  pre.ir .n { color:var(--muted); }
  pre.ir .r { color:var(--ok); }
  .kv { padding:14px 16px; font-family:var(--mono); font-size:12.5px; }
  .kv div { margin-bottom:8px; word-break:break-word; }
  .kv .k { color:var(--muted); }
  .refusal { color:var(--danger); font-family:var(--mono); font-size:13px; }
  .note { padding:14px 16px; color:var(--muted); font-size:13px; }
  .badge { font-size:11.5px; padding:2px 7px; border-radius:5px; background:var(--surface2); color:var(--muted); }
</style>
</head>
<body>
<header>
  <span class="nplogo" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <rect x="1"  y="1"  width="6" height="6" rx="1" fill="#4dabcf"/>
      <rect x="9"  y="1"  width="6" height="6" rx="1" fill="#4d77cf"/>
      <rect x="17" y="1"  width="6" height="6" rx="1" fill="#4dabcf"/>
      <rect x="1"  y="9"  width="6" height="6" rx="1" fill="#4d77cf"/>
      <rect x="9"  y="9"  width="6" height="6" rx="1" fill="#4dabcf"/>
      <rect x="17" y="9"  width="6" height="6" rx="1" fill="#4d77cf"/>
      <rect x="1"  y="17" width="6" height="6" rx="1" fill="#4dabcf"/>
      <rect x="9"  y="17" width="6" height="6" rx="1" fill="#4d77cf"/>
      <rect x="17" y="17" width="6" height="6" rx="1" fill="#4dabcf"/>
    </svg>
  </span>
  <h1>numpy explore</h1>
  <span class="tag">Type a NumPy program</span>
  <div class="right">
    <span class="status" id="status"><span class="dot"></span>booting</span>
    <a class="glink" href="https://github.com/aadya940/scikit-verify">scikit-verify</a>
    <a class="glink" href="guide.html">guide</a>
    <button id="share">copy link</button>
  </div>
</header>

<main>
  <div class="col">
    <div class="tabs" id="srcTabs"></div>
    <div class="body"><textarea id="code"></textarea></div>
  </div>
  <div class="col">
    <div class="tabs" id="outTabs"></div>
    <div class="body" id="outBody"></div>
  </div>
</main>

<script>
const EXAMPLES = [
  ["piecewise", "# inputs default to length-5 arrays\n# choose your own with ARGS = (np.eye(3), ...)\n\ndef rectified(x):\n    return np.piecewise(x, [x < 0],\n                        [lambda t: -t, lambda t: t**2])\n"],
  ["variance", "def sample_var(x):\n    m = x.mean()\n    return np.sum((x - m)**2) / (len(x) - 1)\n"],
  ["median", "def middle(a):\n    return np.median(a)\n"],
  ["softmax", "def softmax(v):\n    e = np.exp(v - v.max())\n    return e / e.sum()\n"],
  ["refusal", "def rounded(a):\n    return a.astype(int).mean()\n"],
  ["solve", "ARGS = (np.array([[2.0, 1.0],\n                  [1.0, 3.0]]),\n        np.array([1.0, 2.0]))\n\ndef solve_sum(A, b):\n    return np.linalg.solve(A, b).sum()\n"],
  ["scratch", "# ARGS = (np.eye(3),)\n\ndef f(x):\n    return x @ x\n"],
];
const OUT_TABS = ["math", "steps", "cse", "value"];

const DRIVER = `
import inspect, json, linecache, warnings
warnings.filterwarnings("ignore")
import numpy as np, sympy
from skverify import to_sympy

_RUN = [0]
_SAMPLES = [
    np.array([3.0, 1.0, 4.0, 1.5, 2.2]),
    np.array([2.0, 1.0, 5.0, 3.0, 4.0]),
    np.array([0.7, 1.2, 2.5, 0.3, 0.9]),
]

def _conds(pre):
    if pre is None or pre is True or pre is sympy.true:
        return []
    return list(pre.args) if isinstance(pre, sympy.And) else [pre]

def _cse_text(out):
    try:
        defs, steps = out.cse_steps()
    except Exception:
        return ""
    lines = [f"{s} = {e}" for s, e in defs]
    if lines:
        lines.append("")
    lines.append(f"result = {steps[-1]}" if steps else "")
    return "\\n".join(lines)

def skv_render(src):
    _RUN[0] += 1
    fname = f"<explorer-{_RUN[0]}>"
    linecache.cache[fname] = (len(src), None, src.splitlines(True), fname)
    ns = {"np": np, "numpy": np, "sympy": sympy}
    try:
        exec(compile(src, fname, "exec"), ns)
    except Exception as e:
        return json.dumps({"state": "syntax", "msg": f"{type(e).__name__}: {e}"})
    fns = [v for v in ns.values()
           if inspect.isfunction(v) and v.__code__.co_filename == fname]
    if not fns:
        return json.dumps({"state": "empty"})
    fn = fns[-1]
    if "ARGS" in ns:
        # the buffer chose its own inputs
        given = ns["ARGS"]
        if not isinstance(given, (tuple, list)):
            given = (given,)
        args = [np.copy(a) if isinstance(a, np.ndarray) else a for a in given]
    else:
        npar = len(inspect.signature(fn).parameters)
        args = [_SAMPLES[i % len(_SAMPLES)].copy() for i in range(npar)]
    try:
        out = to_sympy(fn, *args)
    except NotImplementedError as e:
        return json.dumps({"state": "refused", "msg": str(e), "name": fn.__name__})
    except Exception as e:
        return json.dumps({"state": "error", "msg": f"{type(e).__name__}: {e}"})
    # Functions like np.linalg.eig and np.modf return several traced values,
    # and user code returns lists, dicts and plain objects too.
    def _flatten(o):
        if isinstance(o, (tuple, list)):
            r = []
            for x in o:
                r.extend(_flatten(x))
            return r
        if isinstance(o, dict):
            r = []
            for x in o.values():
                r.extend(_flatten(x))
            return r
        return [o]
    parts = _flatten(out)
    if not parts or all(p is None for p in parts):
        return json.dumps({"state": "error",
                           "msg": "the function returned nothing to trace"})
    d = {"state": "ok", "name": fn.__name__, "parts": [], "conds": [],
         "sealed": [], "ir": "", "cse": "", "value": "", "shape": ""}
    seen_c, seen_s, irs, cses, vals, shapes = set(), set(), [], [], [], []
    for k, p in enumerate(parts):
        label = f"out[{k}]" if len(parts) > 1 else ""
        if not hasattr(p, "formula"):
            # a plain python value came back untraced
            d["parts"].append({"label": label, "plain": repr(p)[:200]})
            vals.append(repr(p)[:200]); shapes.append("")
            continue
        try:
            d["parts"].append({"label": label,
                               "latex": sympy.latex(p.formula),
                               "sym": str(p.formula)})
        except Exception as e:
            return json.dumps({"state": "error", "msg": f"render: {e}"})
        for c in _conds(getattr(p, "preconditions", None)):
            t = sympy.latex(c)
            if t not in seen_c:
                seen_c.add(t); d["conds"].append(t)
        for u in (getattr(p, "unchecked", None) or ()):
            t = str(u[0])
            if t not in seen_s:
                seen_s.add(t); d["sealed"].append(t)
        try:
            txt = p.derivation()
            irs.append((f"# {label}\\n" + txt) if label else txt)
        except Exception:
            pass
        c = _cse_text(p)
        if c:
            cses.append((f"# {label}\\n" + c) if label else c)
        try:
            v = p.value
            vals.append(str(v if np.isscalar(v) else np.asarray(v).round(6).tolist()))
        except Exception:
            vals.append("")
        shapes.append(str(getattr(p, "shape", "")))
    d["ir"] = "\\n\\n".join(irs)
    d["cse"] = "\\n\\n".join(cses)
    d["value"] = " , ".join(vals) if len(parts) > 1 else (vals[0] if vals else "")
    d["shape"] = " , ".join(shapes) if len(parts) > 1 else (shapes[0] if shapes else "")
    d["latex"] = d["parts"][0].get("latex", "")
    d["sym"] = " , ".join(p.get("sym", p.get("plain", "")) for p in d["parts"])
    return json.dumps(d)
`;

const $ = id => document.getElementById(id);
let pyodide = null, cm = null, timer = null, running = false, pending = false;
let tabs = EXAMPLES.map(e => ({ name: e[0], src: e[1] }));
let active = 0, outTab = "math", last = null;

function setStatus(t, cls) { $("status").innerHTML = '<span class="dot ' + (cls||"") + '"></span>' + t; }

function drawSrcTabs() {
  const el = $("srcTabs"); el.innerHTML = "";
  tabs.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.textContent = t.name;
    b.setAttribute("aria-selected", i === active ? "true" : "false");
    b.onclick = () => { tabs[active].src = cm.getValue(); active = i; cm.setValue(tabs[i].src); drawSrcTabs(); run(); };
    el.appendChild(b);
  });
}
function drawOutTabs() {
  const el = $("outTabs"); el.innerHTML = "";
  OUT_TABS.forEach(n => {
    const b = document.createElement("button");
    b.className = "tab"; b.textContent = n;
    b.setAttribute("aria-selected", n === outTab ? "true" : "false");
    b.onclick = () => { outTab = n; drawOutTabs(); paint(); };
    el.appendChild(b);
  });
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function irHTML(ir) {
  return ir.split("\n").map(l => {
    if (l.startsWith("result")) return '<span class="r">' + esc(l) + '</span>';
    const m = l.match(/^(step \d+:)(.*)$/);
    return m ? '<span class="n">' + esc(m[1]) + '</span>' + esc(m[2]) : esc(l);
  }).join("\n");
}

function paint() {
  const b = $("outBody"), r = last;
  if (!r) { b.innerHTML = '<div class="note">waiting</div>'; return; }
  if (r.state === "refused") {
    b.innerHTML = '<div class="note"><div class="refusal">refused</div><p>' + esc(r.msg) +
      '</p><p>scikit-verify returns an exact formula or refuses. A refusal is a designed outcome, not a failure.</p></div>';
    return;
  }
  if (r.state !== "ok") {
    b.innerHTML = '<div class="note">' + esc(r.msg || "define a function to see its mathematics") + '</div>';
    return;
  }
  if (outTab === "math") {
    const parts = r.parts && r.parts.length ? r.parts : [{ label: "", latex: r.latex, sym: r.sym }];
    b.innerHTML = '<div id="mathPane">' + parts.map((p, i) =>
      (p.label ? '<div class="section">' + esc(p.label) + '</div>' : '') +
      '<div class="bigmath" id="bm' + i + '"></div>').join("") +
      '<div id="extra"></div></div>';
    parts.forEach((p, i) => {
      const el = document.getElementById("bm" + i);
      if (p.plain !== undefined) {
        el.innerHTML = '<code style="font-family:var(--mono);font-size:13px;color:var(--muted);">not traced: ' + esc(p.plain) + '</code>';
        return;
      }
      try { katex.render(p.latex, el, { displayMode: true, throwOnError: false }); }
      catch (e) { el.textContent = p.sym; }
    });
    let h = "";
    if (r.conds && r.conds.length) {
      h += '<div class="section">holds when</div>';
      r.conds.forEach(c => {
        let s; try { s = katex.renderToString(c, { throwOnError: false }); } catch (e) { s = esc(c); }
        h += '<span class="cond">' + s + '</span>';
      });
    }
    if (r.sealed && r.sealed.length) {
      h += '<div class="section">sealed compiled calls</div><span class="badge">' + r.sealed.map(esc).join('</span> <span class="badge">') + '</span>';
    }
    $("extra").innerHTML = h;
  } else if (outTab === "steps") {
    b.innerHTML = r.ir ? '<pre class="ir">' + irHTML(r.ir) + '</pre>'
                       : '<div class="note">no derivation for this one</div>';
  } else if (outTab === "cse") {
    b.innerHTML = r.cse ? '<pre class="ir">' + esc(r.cse) + '</pre>'
                        : '<div class="note">no shared subexpressions</div>';
  } else {
    b.innerHTML = '<div class="kv">' +
      '<div><span class="k">function </span>' + esc(r.name) + '</div>' +
      '<div><span class="k">shape    </span>' + esc(r.shape) + '</div>' +
      '<div><span class="k">value    </span>' + esc(r.value) + '</div>' +
      '<div><span class="k">formula  </span>' + esc(r.sym) + '</div>' +
      '</div>';
  }
}

async function run() {
  if (!pyodide) return;
  if (running) { pending = true; return; }
  running = true; setStatus("tracing", "busy");
  try {
    pyodide.globals.set("_src", cm.getValue());
    last = JSON.parse(await pyodide.runPythonAsync("skv_render(_src)"));
    setStatus(last.state === "ok" ? "traced" : last.state, last.state === "ok" ? "ok" : "err");
  } catch (e) {
    last = { state: "error", msg: String(e).trim().split("\n").pop() };
    setStatus("error", "err");
  }
  paint();
  running = false;
  if (pending) { pending = false; run(); }
}

function schedule(){ clearTimeout(timer); timer = setTimeout(run, 400); }

function encodeSrc(s){ return btoa(unescape(encodeURIComponent(s))); }
function decodeSrc(b){ return decodeURIComponent(escape(atob(b))); }

$("share").onclick = async () => {
  // Put the link in the address bar first, so it is shareable even when the
  // clipboard is unavailable, then try the clipboard and say which happened.
  history.replaceState(null, "", "#src=" + encodeSrc(cm.getValue()));
  let ok = false;
  try { await navigator.clipboard.writeText(location.href); ok = true; } catch (e) {}
  const b = $("share");
  b.textContent = ok ? "copied" : "link is in the address bar";
  setTimeout(() => { b.textContent = "copy link"; }, 1600);
};

// A shared link pasted while the page is already open changes only the
// fragment, which does not reload. Pick it up explicitly.
addEventListener("hashchange", () => {
  const m = location.hash.match(/#src=(.+)$/);
  if (!m) return;
  try {
    const src = decodeSrc(m[1]);
    if (src === cm.getValue()) return;
    tabs.unshift({ name: "shared", src });
    active = 0; cm.setValue(src); drawSrcTabs(); run();
  } catch (e) {}
});

cm = CodeMirror.fromTextArea($("code"), {
  mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4,
  theme: "default",
  lineWrapping: true, viewportMargin: Infinity,
});
cm.on("change", () => { tabs[active].src = cm.getValue(); schedule(); });

(function initSource(){
  const m = location.hash.match(/#src=(.+)$/);
  if (m) {
    try {
      tabs.unshift({ name: "shared", src: decodeSrc(m[1]) });
      active = 0;
    } catch (e) {}
  }
  cm.setValue(tabs[active].src);
})();
drawSrcTabs(); drawOutTabs(); paint();

(async function boot(){
  try {
    setStatus("loading python", "busy");
    pyodide = await loadPyodide();
    setStatus("loading numpy and sympy", "busy");
    await pyodide.loadPackage(["numpy", "sympy", "micropip"]);
    setStatus("installing scikit-verify", "busy");
    await pyodide.runPythonAsync(
      "import micropip\n" +
      "await micropip.install('scikit-verify', deps=False)\n");
    await pyodide.runPythonAsync(DRIVER);
    await run();
  } catch (e) {
    console.error(e);
    setStatus(String(e).trim().split("\n").pop(), "err");
  }
})();
</script>
</body>
</html>
